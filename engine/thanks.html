<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Your kit — The €0 Content Engine</title>
<style>
  :root{--bg:#06080d;--cyan:#00e5ff;--txt:#e8eaf0;--mut:#7a8299;--line:#1b2233;--panel:#0e1322;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(160deg,#0a0e18,#06080d 70%);color:var(--txt);
       font:17px/1.6 -apple-system,"Segoe UI",Inter,Arial,sans-serif;min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:620px;text-align:center;background:var(--panel);border:1px solid var(--line);
       border-radius:20px;padding:54px 44px;box-shadow:0 30px 80px #00000088}
  .tag{display:inline-block;font:700 11px ui-monospace,monospace;letter-spacing:.2em;color:var(--cyan);
       border:1px solid var(--cyan);border-radius:99px;padding:7px 14px}
  h1{font-size:40px;letter-spacing:-1px;margin:20px 0 10px}
  p{color:#cdd6e3;margin:10px 0}
  .btn{display:inline-block;margin-top:22px;background:var(--cyan);color:#04121a;font-weight:800;
       padding:16px 34px;border-radius:12px;font-size:18px}
  .small{color:var(--mut);font-size:13px;margin-top:22px}
  a.alt{color:var(--cyan)}
</style></head>
<body>
  <div class="box">
    <span class="tag">PAYMENT CONFIRMED</span>
    <h1>Your kit is ready. 🎉</h1>
    <p>Thanks for grabbing <b>The €0 Content Engine</b>. Your 9-part playbook + copy-paste pack is below.</p>
    <!-- The PDF sits next to this page; keep them together when you deploy -->
    <a class="btn" href="content-engine-kit.pdf" download>Download the kit (PDF)</a>

    Want it built for you? <a class="alt" href="https://daimonmedia.com">daimonmedia.com</a></p>
  </div>
</body></html>
